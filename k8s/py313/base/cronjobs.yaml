apiVersion: batch/v1
kind: CronJob
metadata:
  name: metrics
  labels:
    app.kubernetes.io/name: edxapp
    app.kubernetes.io/instance: metrics
    app.kubernetes.io/component: cronjob
spec:
  schedule: "0 3 * * *"
  # Interpreted in the controller-manager time zone (UTC on most clusters); spec.timeZone is deliberately unset, see README.
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 14400
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: edxapp
            app.kubernetes.io/instance: metrics
            app.kubernetes.io/component: cronjob
        spec:
          restartPolicy: Never
          serviceAccountName: edxapp
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: job
              image: edxapp
              imagePullPolicy: IfNotPresent
              args:
                - "manage"
                - "lms"
                - "shell"
                - "-c"
                - |
                    import pathlib
                    globals()['--GLOBAL_SHELL_ARGS'] = ''
                    for name in ('course_list', 'geographical_repartition', 'user_count', 'studio_component_count', 'programmatic_enrollments', 'completions_enrollments', 'course_viewers', 'downloaded_certificates', 'catalog_transformation', 'visits', 'first_connection_count', 'catalog_search', 'page_views', 'learningpath_list', 'learningpath_status'):
                        path = 'scripts/metrics/%s.py' % name
                        exec(compile(pathlib.Path(path).read_text(), path, 'exec'))
              env:
                - name: EDXAPP_SETTINGS
                  value: aws
                - name: CONFIG_ROOT
                  value: /edx/app/edxapp/py313-config
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1536Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: config
                  mountPath: /edx/app/edxapp/py313-config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: log-lms
                  mountPath: /edx/var/log/lms
                - name: log-cms
                  mountPath: /edx/var/log/cms
                - name: media
                  mountPath: /edx/var/edxapp/media
                - name: data
                  mountPath: /edx/var/edxapp/data
                - name: metrics
                  mountPath: /edx-data/metrics
          volumes:
            - name: config
              secret:
                secretName: edxapp-config
                defaultMode: 288 # 0440
            - name: tmp
              emptyDir:
                sizeLimit: 512Mi
            - name: log-lms
              emptyDir:
                sizeLimit: 256Mi
            - name: log-cms
              emptyDir:
                sizeLimit: 256Mi
            - name: media
              emptyDir:
                sizeLimit: 1Gi
            - name: data
              emptyDir:
                sizeLimit: 1Gi
            - name: metrics
              emptyDir:
                sizeLimit: 1Gi
