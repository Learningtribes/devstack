# Equivalents of the three jobs of staging /etc/cron.d/edxapp (course_email_reminder, send_ilt_daily_mail, metrics), schedules as
# staging.env. All suspended: a deployment enables one by patching spec.suspend to false (see README). The Platform scripts
# scripts/*.sh cannot be used in the image: they call `sudo -H -u $EDXAPP_USER` and source /edx/app/edxapp/edxapp_env, which do
# not exist in the container, so each job runs the same Python through `edxapp-entrypoint manage`.
#
# metrics: most of its scripts read /edx/var/log/lms/metrics_*.csv.<yesterday>, written by the LMS pods into their own emptyDir, and
# write JSON into /edx-data/metrics. Neither location is shared between pods here, so the job cannot reproduce staging until the
# owner decides where those CSV logs and the JSON output live (README, open question 5).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: course-email-reminder
  labels:
    app.kubernetes.io/name: edxapp
    app.kubernetes.io/instance: course-email-reminder
    app.kubernetes.io/component: cronjob
spec:
  schedule: "0 4 * * *"
  # Interpreted in the controller-manager time zone (UTC on most clusters); spec.timeZone is deliberately unset, see README.
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: edxapp
            app.kubernetes.io/instance: course-email-reminder
            app.kubernetes.io/component: cronjob
        spec:
          restartPolicy: Never
          serviceAccountName: edxapp
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: job
              image: edxapp
              imagePullPolicy: IfNotPresent
              args:
                - "manage"
                - "lms"
                - "shell"
                - "-c"
                - "exec(compile(__import__('pathlib').Path('scripts/course_email_reminder.py').read_text(), 'scripts/course_email_reminder.py', 'exec'))"
              env:
                - name: EDXAPP_SETTINGS
                  value: aws
                - name: CONFIG_ROOT
                  value: /edx/app/edxapp/py313-config
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1536Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: config
                  mountPath: /edx/app/edxapp/py313-config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: log-lms
                  mountPath: /edx/var/log/lms
                - name: log-cms
                  mountPath: /edx/var/log/cms
                - name: media
                  mountPath: /edx/var/edxapp/media
                - name: data
                  mountPath: /edx/var/edxapp/data
          volumes:
            - name: config
              secret:
                secretName: edxapp-config
                defaultMode: 288 # 0440
            - name: tmp
              emptyDir:
                sizeLimit: 512Mi
            - name: log-lms
              emptyDir:
                sizeLimit: 256Mi
            - name: log-cms
              emptyDir:
                sizeLimit: 256Mi
            - name: media
              emptyDir:
                sizeLimit: 1Gi
            - name: data
              emptyDir:
                sizeLimit: 1Gi
---
