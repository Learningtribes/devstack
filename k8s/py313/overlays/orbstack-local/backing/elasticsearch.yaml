# Elasticsearch 8.19 single node, modelled on the staging host: security enabled, HTTPS only (platform PR 2458, BRINGUP_ES_USE_SSL),
# basic auth. The platform verifies the server certificate in Python 3.13 strict mode and by host name, so the autogenerated
# http_ca.crt of the image (no SAN for the Service name) is not usable. The `certs` init container creates, once, a CA and a node
# certificate with the Service DNS names through elasticsearch-certutil (the CA carries keyUsage keyCertSign, which strict mode
# requires; verified against Python 3.13 with the same commands). The CA private key is discarded; a lost certs volume therefore
# means a new CA and a new es-ca.crt in the Secret edxapp-config.
#
# Run-time steps that belong to part C (README "Elasticsearch"): copy the public CA out of the pod into edxapp-config (key
# es-ca.crt) and create the application role and user as 03a-elasticsearch.sh does, through `kubectl exec` into this pod, where
# the bootstrap password is already in $ELASTIC_PASSWORD.
#
# Not read-only root: with ELASTIC_PASSWORD the entrypoint writes config/elasticsearch.keystore. Uid 1000 with group 0 is how the
# image is built (its config directory is group-writable for gid 0).
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/instance: elasticsearch
    app.kubernetes.io/component: backing
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/instance: elasticsearch
  ports:
    - name: https
      port: 9200
      targetPort: https
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/instance: elasticsearch
    app.kubernetes.io/component: backing
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
      app.kubernetes.io/instance: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/instance: elasticsearch
        app.kubernetes.io/component: backing
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: certs
          image: elasticsearch:8.19.0
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -ec
            - |
              certs=/usr/share/elasticsearch/config/certs
              if [ -s "$certs/ca/ca.crt" ] && [ -s "$certs/node/elasticsearch.crt" ] && [ -s "$certs/node/elasticsearch.key" ]; then
                echo "certificates already present"; exit 0
              fi
              util=/usr/share/elasticsearch/bin/elasticsearch-certutil
              work=$(mktemp -d)
              cd "$work"
              # certutil resolves a relative output path against its home directory (read-only here), not the working directory
              "$util" ca --silent --pem --out "$work/ca.zip"
              unzip -q ca.zip -d ca-out
              "$util" cert --silent --pem --ca-cert "$work/ca-out/ca/ca.crt" --ca-key "$work/ca-out/ca/ca.key" --name elasticsearch \
                --dns elasticsearch --dns "elasticsearch.${POD_NAMESPACE}.svc" --dns "elasticsearch.${POD_NAMESPACE}.svc.cluster.local" \
                --dns localhost --ip 127.0.0.1 --out "$work/node.zip"
              unzip -q node.zip -d node-out
              mkdir -p "$certs/ca" "$certs/node"
              cp ca-out/ca/ca.crt "$certs/ca/ca.crt"
              cp node-out/elasticsearch/elasticsearch.crt node-out/elasticsearch/elasticsearch.key "$certs/node/"
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/config/certs
              subPath: certs
            - name: tmp
              mountPath: /tmp
      containers:
        - name: elasticsearch
          image: elasticsearch:8.19.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: ES_JAVA_OPTS
              value: -Xms512m -Xmx512m
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.http.ssl.enabled
              value: "true"
            - name: xpack.security.http.ssl.key
              value: certs/node/elasticsearch.key
            - name: xpack.security.http.ssl.certificate
              value: certs/node/elasticsearch.crt
            - name: xpack.security.http.ssl.certificate_authorities
              value: certs/ca/ca.crt
            - name: xpack.security.transport.ssl.enabled
              value: "true"
            - name: xpack.security.transport.ssl.key
              value: certs/node/elasticsearch.key
            - name: xpack.security.transport.ssl.certificate
              value: certs/node/elasticsearch.crt
            - name: xpack.security.transport.ssl.certificate_authorities
              value: certs/ca/ca.crt
            - name: xpack.security.transport.ssl.verification_mode
              value: certificate
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backing-credentials
                  key: elastic-password
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 1536Mi
          # TCP only: an HTTP probe would need the bootstrap password; the application's /heartbeat exercises Elasticsearch itself.
          startupProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
              subPath: data
            - name: data
              mountPath: /usr/share/elasticsearch/config/certs
              subPath: certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 8Gi
