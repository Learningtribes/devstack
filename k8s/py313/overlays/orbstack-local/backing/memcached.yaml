apiVersion: v1
kind: Service
metadata:
  name: memcached
  labels:
    app.kubernetes.io/name: memcached
    app.kubernetes.io/instance: memcached
    app.kubernetes.io/component: backing
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: memcached
    app.kubernetes.io/instance: memcached
  ports:
    - name: memcached
      port: 11211
      targetPort: memcached
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memcached
  labels:
    app.kubernetes.io/name: memcached
    app.kubernetes.io/instance: memcached
    app.kubernetes.io/component: backing
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memcached
      app.kubernetes.io/instance: memcached
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memcached
        app.kubernetes.io/instance: memcached
        app.kubernetes.io/component: backing
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image user "memcache" is non-numeric, which the kubelet cannot verify against runAsNonRoot.
        runAsUser: 11211
        runAsGroup: 11211
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: memcached
          image: memcached:1.6.45
          imagePullPolicy: IfNotPresent
          args: ["-m", "128", "-c", "1024"]
          ports:
            - name: memcached
              containerPort: 11211
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: memcached
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: memcached
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
