apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Opt-in: every Celery queue of the staging WORKER_SET on top of the local overlay (render or apply THIS directory instead of ../orbstack-local).
resources:
  - ../orbstack-local
replicas:
  - name: worker-lms-high
    count: 1
  - name: worker-lms-grade
    count: 1
  - name: worker-lms-progress
    count: 1
  - name: worker-lms-high-mem
    count: 1
  - name: worker-lms-low
    count: 1
  - name: worker-cms-low
    count: 1
