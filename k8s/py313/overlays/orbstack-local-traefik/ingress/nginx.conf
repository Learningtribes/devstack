# Static files of the application image, one tree for both sites: the tree root is /static/ (LMS) and /static/studio/ (Studio).
# Mirrors the production nginx rules described in the triboo-doc staging docs: static files from the collected tree, *.json / *.xml /
# README.TXT answer 403 (webpack-stats.json and staticfiles.json stay private), files with a 12-hex content hash are cached long.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /srv/www;
    autoindex off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* ^/static/(studio/)?[^/]+\.(json|xml)$ { return 403; }
    location ~ /README\.TXT$ { return 403; }

    # ManifestStaticFilesStorage names: name.<12 hex>.ext
    location ~ "^/static/.+\.[0-9a-f]{12}\.[^/.]+$" {
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /static/ {
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location / { return 404; }
}
