apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Cluster-scoped and applied on its own (server-side) before ../, because a TLSStore cannot be created before its CRD is established.
# The label is how traefik-down finds the CRDs this feature installed; it never selects a CRD by name alone.
resources:
  - crds.yaml
labels:
  - pairs:
      py313.learningtribes.com/feature: traefik-local
    includeSelectors: false
