apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: traefik
# Traefik talks to the API server (Ingress, Middleware, TLSStore, Secrets, EndpointSlices), so it needs its token.
automountServiceAccountToken: true
---
# Least privilege: both providers are restricted to the namespaces traefik and py313-prod-local (deployment.yaml), so every namespaced
# resource is granted by a Role in exactly those two namespaces (this file, and app-rbac/ for py313-prod-local). The only cluster-wide
# grants are the cluster-scoped kinds: IngressClass and Node. The rules are the upstream v3.7.19 kubernetes-crd-rbac.yml without `pods`
# (OpenTelemetry attributes only). Traefik v3.7 starts informers for ConfigMaps and Nodes whatever the provider settings; with either
# one forbidden it never syncs its configuration and answers with its default certificate (verified here by removing them: both
# hosts failed TLS until the grants were restored). Read access to every traefik.io kind is required for the same reason (crds/crds.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-py313-local
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-py313-local
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-py313-local
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: traefik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: traefik-py313-local
  namespace: traefik
rules:
  - apiGroups: [""]
    resources: [services, secrets, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  # publishedService: writes the LoadBalancer address into the Ingress status.
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
  - apiGroups: [traefik.io]
    resources:
      - middlewares
      - middlewaretcps
      - ingressroutes
      - traefikservices
      - ingressroutetcps
      - ingressrouteudps
      - tlsoptions
      - tlsstores
      - serverstransports
      - serverstransporttcps
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik-py313-local
  namespace: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: traefik-py313-local
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: traefik
