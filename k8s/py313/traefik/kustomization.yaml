apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Traefik without Helm. Apply ./crds first (scripts/traefik-install does), then this directory. The Secret local-prod-tls
# (default certificate, namespace traefik) is created at run time by scripts/gen-local-tls and is not rendered here.
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - tlsstore.yaml
labels:
  - pairs:
      py313.learningtribes.com/feature: traefik-local
    includeSelectors: false
    includeTemplates: true
