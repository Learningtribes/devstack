<div class="wrapper-comp-settings is-active editor-with-buttons ilt-xblock-studio" id="settings-tab">
    <ul class="list-input settings-list">
        <li class="field comp-setting-entry is-set">
            <div class="wrapper-comp-setting">
                <label class="label setting-label" for="ilt-title">${_(title)}</label>
                <input class="input setting-input" name="ilt-title" id="ilt-title"
                       type="text" v-model.trim="title"/>
            </div>
            <span class="tip setting-help">${_(title_help)}</span>
        </li>
        <li class="field comp-setting-entry is-set">
            <div class="wrapper-comp-setting">
                <label class="label setting-label" for="ilt-description">${_(desc)}</label>
                <input class="input setting-input" name="ilt-description" id="ilt-description"
                       type="text" v-model.trim="description"/>
            </div>
            <span class="tip setting-help">${_(desc_help)}</span>
        </li>
        <li class="field comp-setting-entry is-set">
            <div class="wrapper-comp-setting">
                <label class="label setting-label" for="ilt-weight">${_(weight)}</label>
                <input class="input setting-input" name="ilt-weight" id="ilt-weight"
                       type="text" v-model.trim="weight"/>
            </div>
            <span class="tip setting-help">${_(weight_help)}</span>
        </li>
    </ul>

    <div class="xblock-actions">
        <ul>
            <li class="action-item">
                <a href="#" class="button action-primary save-button" v-on:click="saveILT">${_("Save")}</a>
            </li>
            <li class="action-item">
                <a href="#" class="button cancel-button" v-on:click="cancelILT">${_("Cancel")}</a>
            </li>
        </ul>
    </div>
</div>
