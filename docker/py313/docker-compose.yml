name: py313

services:
  mysql:
    image: mysql@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    container_name: py313.mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${PY313_MYSQL_ROOT_PASSWORD:?run make env}
      MYSQL_DATABASE: edxapp
      MYSQL_USER: ${PY313_MYSQL_USER:-edxapp}
      MYSQL_PASSWORD: ${PY313_MYSQL_PASSWORD:?run make env}
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo:
    image: mongo@sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907
    container_name: py313.mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PY313_MONGO_USER:-edxapp}
      MONGO_INITDB_ROOT_PASSWORD: ${PY313_MONGO_PASSWORD:?run make env}
    ports:
      - "127.0.0.1:27117:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq@sha256:84352fa7b36f80b3669f5c40963cb2f0f4cf0ecc67d4cf77a5282c2b5934cffc
    container_name: py313.rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${PY313_RABBITMQ_USER:-edxapp}
      RABBITMQ_DEFAULT_PASS: ${PY313_RABBITMQ_PASSWORD:?run make env}
    ports:
      - "127.0.0.1:15673:5672"
      - "127.0.0.1:15674:15672"
    volumes:
      - ./rabbitmq/20-permit-transient-nonexcl.conf:/etc/rabbitmq/conf.d/20-permit-transient-nonexcl.conf:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 30

  # Control group for the pidbox matrix: same broker, default deprecated-feature policy.
  rabbitmq-noperm:
    image: rabbitmq@sha256:84352fa7b36f80b3669f5c40963cb2f0f4cf0ecc67d4cf77a5282c2b5934cffc
    container_name: py313.rabbitmq-noperm
    profiles: ["noperm"]
    environment:
      RABBITMQ_DEFAULT_USER: ${PY313_RABBITMQ_USER:-edxapp}
      RABBITMQ_DEFAULT_PASS: ${PY313_RABBITMQ_PASSWORD:?run make env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 30

  memcached:
    image: memcached@sha256:ab65f39bfa5b1e31bff3bdccfd48af85fee6fdcbf0eb877175fcb170a4e1bd2f
    container_name: py313.memcached
    ports:
      - "127.0.0.1:11311:11211"

  valkey:
    image: valkey/valkey@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2
    container_name: py313.valkey
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: elasticsearch@sha256:8eb0ee819c020d1275e7f7b82aefdea5d50014c8986bb5be64d80232b58119a5
    container_name: py313.elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:19200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30

volumes:
  mysql_data:
  mongo_data:
  rabbitmq_data:
  elasticsearch_data:
