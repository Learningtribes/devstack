pr: 2397
title: edx-enterprise DELETE
base: master
# DCC — DELETE edx-enterprise pip apps + openedx.features.enterprise_support.
# Branch dcc-enterprise-removal @ 475645cb90f. 61 files, +245/−2905.
#
# DELETE  OPTIONAL_APPS (enterprise/consent/integrated_channels/django_object_actions),
#         EnterpriseMiddleware, enterprise_support/, enterprise.urls include,
#         embargo stub (only remaining consumer was edx-enterprise),
#         change_enterprise_user_username, dashboard consent banner template
# KEEP    email_marketing, third_party_auth (pipeline insert dropped),
#         CourseMode / professional certs, edx-proctoring
#
# ENABLE_ENTERPRISE_INTEGRATION defaults False, so /enterprise/ is already
# 404 on master. Do NOT assert that URL — it is vacuous.
#
# DISCRIMINATOR surfaces (pass on PR AND fail on master — local Py2
# destack 2026-09-22, unauth curl -s no-follow):
#   Surface 1 — admin EnterpriseCustomer 404 vs 302-to-login (qastaff → 200)
#   Surface 2 — admin DataSharingConsent 404 vs 302-to-login
#
# GATE surfaces (prove no crash after Mako imports + OPTIONAL_APPS gone):
#   Surface 3 — LMS home 200
#   Surface 4 — login page 200 (enterprise_sidebar.html deleted)
#   Surface 5 — learner dashboard 200 (consent include + helper deleted)
#   Surface 6 — account settings 200 (enterprise_name stubbed to None)
#   Surface 7 — Studio home 200
#
# VACUOUS (excluded):
#   /enterprise/ and /consent/api/... — 404 on master already (flag off).
#   /triboo-guanli/integrated_channel/ — 404 on master (no admin site).
#   Dashboard consent banner DOM absence — helper already returned '' when
#   identity tables are empty, so both branches omit the banner.
#   login.underscore enterpriseName copy — gated on context.enterpriseName,
#   which is empty without an EnterpriseCustomer.

surfaces:
  # ── Discriminators: Django admin model registration gone ──
  # Admin at /triboo-guanli/ (fork custom), gated on DEBUG or
  # ENABLE_DJANGO_ADMIN_SITE. Devstack DEBUG=True → always routable.
  # Master: OPTIONAL_APPS still loads enterprise/consent → 200 for qastaff.
  # enterprise-rm: apps not in INSTALLED_APPS → 404.
  # request:true so we assert the raw status, not a redirected login HTML.

  - id: admin — EnterpriseCustomer model removed
    url: /triboo-guanli/enterprise/enterprisecustomer/
    auth: qastaff
    request: true
    derived_from:
      - lms/envs/common.py
      - cms/envs/common.py
      - requirements/edx/base.in
    assert:
      status: 404

  - id: admin — DataSharingConsent model removed
    url: /triboo-guanli/consent/datasharingconsent/
    auth: qastaff
    request: true
    derived_from:
      - lms/envs/common.py
      - cms/envs/common.py
    assert:
      status: 404

  # ── Gates: process boot + Mako call-sites unhooked ──

  - id: LMS homepage — no import error
    url: /
    auth: qacert
    derived_from:
      - lms/envs/common.py
      - lms/urls.py
    assert:
      status: 200

  - id: login page — enterprise_sidebar template gone
    url: /login
    auth: none
    derived_from:
      - lms/templates/student_account/enterprise_sidebar.html
      - lms/djangoapps/student_account/views.py
    assert:
      status: 200

  - id: learner Dashboard — consent banner helper gone
    url: /dashboard
    auth: qacert
    derived_from:
      - common/djangoapps/student/views/dashboard.py
      - lms/templates/dashboard.html
      - lms/templates/dashboard/_dashboard_show_consent.html
    assert:
      status: 200

  - id: account settings — enterprise_name stubbed
    url: /account/settings
    auth: qacert
    derived_from:
      - lms/djangoapps/student_account/views.py
      - lms/templates/student_account/account_settings.html
    assert:
      status: 200

  - id: Studio home — no import error
    url: http://localhost:18010/home/
    auth: qastaff
    derived_from:
      - cms/envs/common.py
      - cms/urls.py
    assert:
      status: 200
