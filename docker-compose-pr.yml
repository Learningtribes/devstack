version: "2.1"

# PR-under-test override.
#
# Serve a specific platform git worktree instead of the default
# ${DEVSTACK_WORKSPACE}/platform, so browser-acceptance can target a PR branch
# WITHOUT polluting the master checkout. Use this INSTEAD of
# docker-compose-host.yml for lms/studio:
#
#   PLATFORM_MOUNT=/Users/you/workspace/hawthorn/platform-badges-removal \
#     docker compose -f docker-compose.yml -f docker-compose-pr.yml up -d lms studio
#
# Recreating is cheap/safe because in-container fixes live in the m5-fixed images
# (see docs/backup-restore.md). Switch back to master by re-running with
# docker-compose-host.yml (or PLATFORM_MOUNT=${DEVSTACK_WORKSPACE}/platform).
services:
  # Keep the Learningtribes Discovery fork mounted when this override is used
  # without docker-compose-host.yml. Its program models match the shared DB.
  discovery:
    command: >
      bash -c 'source /edx/app/discovery/discovery_env &&
      (python -c "import rest_framework_nested" || pip install drf-nested-routers==0.91) &&
      while true; do python /edx/app/discovery/discovery/manage.py runserver 0.0.0.0:18381; sleep 2; done'
    volumes:
      - ${DEVSTACK_WORKSPACE}/course-discovery:/edx/app/discovery/discovery:cached
      - discovery_node_modules:/edx/app/discovery/discovery/node_modules
      - ${DEVSTACK_WORKSPACE}/src:/edx/src:cached
  lms:
    volumes:
      - ${PLATFORM_MOUNT:?set PLATFORM_MOUNT to a platform worktree path}:/edx/app/edxapp/edx-platform:cached
      - edxapp_node_modules:/edx/app/edxapp/edx-platform/node_modules
      - ${DEVSTACK_WORKSPACE}/src:/edx/src:cached
  studio:
    volumes:
      - ${PLATFORM_MOUNT:?set PLATFORM_MOUNT to a platform worktree path}:/edx/app/edxapp/edx-platform:cached
      - edxapp_node_modules:/edx/app/edxapp/edx-platform/node_modules
      - ${DEVSTACK_WORKSPACE}/src:/edx/src:cached

# Reuse the existing named volume (devstack_edxapp_node_modules) so node_modules
# survives the mount switch; declared here because host.yml (which normally
# declares it) is intentionally not loaded for PR runs.
volumes:
  discovery_node_modules:
  edxapp_node_modules:
